[package]
name = "ya"
authors = ["kikeg"]
version = "0.4.0"
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0"
description = "Yet Another YAML parser in pure Rust"

# Document the optional `serde` feature (and label the items it gates) on docs.rs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
annotate-snippets = "0.12.16"
winnow = { version = "1.0", features = ["simd"] }
serde = { version = "1.0", optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
criterion = "0.8.2"
rstest = "0.26.1"
serde = { version = "1.0", features = ["derive"] }

[[bench]]
name = "benchmark"
harness = false
